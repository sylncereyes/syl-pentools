# Hanya manusia yang boleh mengedit. Setelah selesai: chmod 444 qa/scope.yml
environment: dev

app:
  frontend_url: http://localhost:3000   # fallback: 3001
  api_url: http://localhost:8000
  docs_url: http://localhost:8000/docs

allowed_hosts: [localhost, 127.0.0.1]
allowed_ports: [3000, 3001, 8000, 5433, 6379]

# Objek scan yang boleh dipakai di fitur scanner/fuzzer platform
scan_targets_allowed:
  - scanme.nmap.org
  - testphp.vulnweb.com
  - testasp.vulnweb.com
  - 127.0.0.1:3002   # Juice Shop lokal (opsional)
  - 127.0.0.1:8081   # DVWA lokal (opsional)

# Hanya untuk memastikan platform MENOLAK input ini (SSRF/blacklist)
negative_test_inputs:
  [127.0.0.1, localhost, 10.0.0.1, 192.168.1.1, 169.254.169.254, "::1", 0.0.0.0]

limits:
  max_parallel_requests: 20
  k6_max_vus: 30
  k6_max_duration: 5m
  bruteforce_max_attempts: 10
  scan_poll_timeout_min: 30

thresholds:
  api_p95_ms: 500
  error_rate_pct: 1
